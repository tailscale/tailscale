name: implement offline local peer relay
on:
  push:
    branches: [offline-local-peer-relay]
permissions:
  contents: write
jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[offline-relay-impl]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Implement and test
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          def replace_once(path, old, new, label):
              p = Path(path); s = p.read_text(); n = s.count(old)
              print(f'{label}: matches={n}')
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {n}')
              p.write_text(s.replace(old, new, 1))

          replace_once('net/udprelay/server.go', '"tailscale.com/net/udprelay/endpoint"\n', '"tailscale.com/net/localrelay"\n\t"tailscale.com/net/udprelay/endpoint"\n', 'server import')
          replace_once('net/udprelay/server.go', '\ts.startPacketReaders()\n\n\tif !s.onlyStaticAddrPorts {', '''\ts.startPacketReaders()\n\n\ts.wg.Add(1)\n\tgo func() {\n\t\tdefer s.wg.Done()\n\t\tctx, cancel := context.WithCancel(context.Background())\n\t\tgo func() {\n\t\t\t<-s.closeCh\n\t\t\tcancel()\n\t\t}()\n\t\tif err := localrelay.Advertise(ctx, s.logf, s.discoPublic, s.uc4Port); err != nil && !s.closed {\n\t\t\ts.logf("local relay discovery: advertiser failed: %v", err)\n\t\t}\n\t}()\n\n\tif !s.onlyStaticAddrPorts {''', 'server advertise')
          replace_once('wgengine/magicsock/relaymanager.go', '"tailscale.com/net/packet"\n', '"tailscale.com/net/localrelay"\n\t"tailscale.com/net/packet"\n', 'relaymanager import')
          replace_once('wgengine/magicsock/relaymanager.go', '\tderpHomeChangeCh    chan derpHomeChangeEvent\n\n\tdiscoInfoMu', '''\tderpHomeChangeCh    chan derpHomeChangeEvent\n\n\tlocalRelayMu      sync.Mutex\n\tlocalRelayByDisco map[key.DiscoPublic]map[netip.AddrPort]time.Time\n\tlocalRelayStarted sync.Once\n\n\tdiscoInfoMu''', 'relaymanager fields')
          replace_once('wgengine/magicsock/relaymanager.go', '\t\tr.derpHomeChangeCh = make(chan derpHomeChangeEvent)\n', '\t\tr.derpHomeChangeCh = make(chan derpHomeChangeEvent)\n\t\tr.localRelayByDisco = make(map[key.DiscoPublic]map[netip.AddrPort]time.Time)\n', 'relaymanager init')

          p = Path('wgengine/magicsock/relaymanager.go'); s = p.read_text()
          old = 'func (r *relayManager) startUDPRelayPathDiscoveryFor(ep *endpoint, lastBest addrQuality, lastBestIsTrusted bool) {'
          print('start discovery matches=', s.count(old))
          if s.count(old) != 1: raise SystemExit('start discovery anchor missing')
          s = s.replace(old, old + '\n\tr.startLocalRelayDiscovery(ep.c)', 1)
          marker = "// stopWork stops all outstanding allocation & handshaking work for 'ep'.\n"
          print('stopWork marker matches=', s.count(marker))
          if s.count(marker) != 1: raise SystemExit('stopWork marker missing')
          insert = '''func (r *relayManager) startLocalRelayDiscovery(c *Conn) {\n\tif c == nil { return }\n\tr.localRelayStarted.Do(func() {\n\t\tgo func() {\n\t\t\terr := localrelay.Listen(c.connCtx, func(addr netip.AddrPort, disco key.DiscoPublic) {\n\t\t\t\tfor _, server := range r.getServers().Slice() {\n\t\t\t\t\tif server.discoKey.Compare(disco) == 0 {\n\t\t\t\t\t\tr.localRelayMu.Lock()\n\t\t\t\t\t\tbyAddr := r.localRelayByDisco[disco]\n\t\t\t\t\t\tif byAddr == nil { byAddr = make(map[netip.AddrPort]time.Time); r.localRelayByDisco[disco] = byAddr }\n\t\t\t\t\t\tbyAddr[addr] = time.Now()\n\t\t\t\t\t\tr.localRelayMu.Unlock()\n\t\t\t\t\t\treturn\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t})\n\t\t\tif err != nil && c.connCtx.Err() == nil { c.logf("local relay discovery: listener failed: %v", err) }\n\t\t}()\n\t})\n}\n\nfunc (r *relayManager) localRelayAddr(disco key.DiscoPublic) (netip.AddrPort, bool) {\n\tr.localRelayMu.Lock(); defer r.localRelayMu.Unlock()\n\tnow := time.Now()\n\tfor addr, seen := range r.localRelayByDisco[disco] {\n\t\tif now.Sub(seen) <= 15*time.Second { return addr, true }\n\t\tdelete(r.localRelayByDisco[disco], addr)\n\t}\n\treturn netip.AddrPort{}, false\n}\n\n'''
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s)
          PY
          gofmt -w net/localrelay/*.go net/udprelay/server.go wgengine/magicsock/relaymanager.go
          go test ./net/localrelay ./net/udprelay ./wgengine/magicsock
          rm -f .github/workflows/implement-offline-local-peer-relay.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: use locally discovered peer relays when offline [offline-relay-impl]'
          git push origin offline-local-peer-relay
